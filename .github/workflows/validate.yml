# Notes
# - cannot run on Windows, as we use shell scripts
# - Most jobs require a Helidon priming build to execute

name: "Validate"

on:
  pull_request:
  push:
    branches-ignore: [ 'release-*' ]
    tags-ignore: [ '**' ]
  workflow_call:

env:
  JAVA_VERSION: '27'
  JAVA_DISTRO: 'oracle'
  HELIDON_PIPELINES: 'true'
  MVN_VERSION: 3.9.9
  MVN_ARGS: |
    -B -fae -e
    -nsu
    -Dmaven.wagon.httpconnectionManager.ttlSeconds=60
    -Dmaven.wagon.http.retryHandler.count=3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prime-build:
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - uses: ./.github/actions/common
        with:
          free-space: 'true'
          maven-cache: read-write
          build-cache: read-write
          run: |
            etc/scripts/prime-build.sh
            mvn ${MVN_ARGS} \
              -Dcache.offline.scopeExcludes=none \
              build-cache:go-offline
  copyright:
    needs: prime-build
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/common
        with:
          build-cache: read-only
          run: etc/scripts/copyright.sh
  checkstyle:
    needs: prime-build
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - uses: ./.github/actions/common
        with:
          build-cache: read-only
          run: etc/scripts/checkstyle.sh
  shellcheck:
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ShellCheck
        run: etc/scripts/shellcheck.sh
  spotbugs:
    needs: prime-build
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - uses: ./.github/actions/common
        with:
          build-cache: read-only
          run: |
            mvn ${MVN_ARGS} \
              -DskipTests \
              -Dmaven.test.skip=true \
              -Pspotbugs \
              verify
  build:
    needs: prime-build
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - uses: ./.github/actions/common
        with:
          free-space: 'true'
          build-cache: read-only
          test-artifact-name: test-results
          run: |
            mvn ${MVN_ARGS} \
                clean install
  build-latest-java:
    needs: prime-build
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - uses: ./.github/actions/common
        with:
          free-space: 'true'
          setup-latest-java: 'true'
          build-cache: read-only
          test-artifact-name: test-results-latest-java
          run: |
            mvn ${MVN_ARGS} \
                -Dcache.enabled=true \
                -DmoduleSet=all \
                -Dsurefire.reportNameSuffix=latest-java \
                clean install
