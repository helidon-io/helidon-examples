# Notes
# - cannot run on Windows, as we use shell scripts
# - Most jobs require a Helidon priming build to execute

name: "Validate"

on:
  pull_request:
  push:
    branches-ignore: [ 'dev-*.x', 'release-*' ]
    tags-ignore: [ '**' ]
  workflow_call:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRO: 'oracle'
  HELIDON_PIPELINES: 'true'
  MAVEN_ARGS: |
    -B -fae -e
    -Dmaven.wagon.httpconnectionManager.ttlSeconds=60
    -Dmaven.wagon.http.retryHandler.count=3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prime-build:
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4.7.1
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Helidon Priming build
        run: |
          mkdir -p ~/.m2/repository/io/helidon/
          echo "empty file" > ~/.m2/repository/io/helidon/empty.txt
          etc/scripts/prime-build.sh
      - name: Upload Maven Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: io-helidon-maven-artifacts
          path: ~/.m2/repository/io/helidon
          retention-days: 1
  copyright:
    needs: prime-build
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4.7.1
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Copyright
        run: etc/scripts/copyright.sh
  checkstyle:
    needs: prime-build
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - name: Download Maven Artifacts
        uses: actions/download-artifact@v4
        with:
          name: io-helidon-maven-artifacts
          path: ~/.m2/repository/io/helidon
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4.7.1
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Checkstyle
        run: etc/scripts/checkstyle.sh
  shellcheck:
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ShellCheck
        run: etc/scripts/shellcheck.sh
  spotbugs:
    needs: prime-build
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - name: Download Maven Artifacts
        uses: actions/download-artifact@v4
        with:
          name: io-helidon-maven-artifacts
          path: ~/.m2/repository/io/helidon
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4.7.1
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Spotbugs
        run: etc/scripts/spotbugs.sh
  build:
    needs: prime-build
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os == 'Linux'
        name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
      - name: Download Maven Artifacts
        uses: actions/download-artifact@v4
        with:
          name: io-helidon-maven-artifacts
          path: ~/.m2/repository/io/helidon
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4.7.1
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Maven build
        run: etc/scripts/build.sh
  build-latest-java:
    needs: prime-build
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os == 'Linux'
        name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
      - name: Download Maven Artifacts
        uses: actions/download-artifact@v4
        with:
          name: io-helidon-maven-artifacts
          path: ~/.m2/repository/io/helidon
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Set up JDK ea-stable
        uses: oracle-actions/setup-java@v1
        with:
          website: jdk.java.net
          release: ea
          version: stable
      - name: Maven build
        run: etc/scripts/build.sh
        env:
          MAVEN_ARGS: -pl !examples/integrations/micronaut/data,!examples/integrations/microstream/greetings-se,!examples/integrations/microstream/greetings-mp
