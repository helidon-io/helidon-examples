server:
  port: 8080
  host: 0.0.0.0

# The following is read by the application and supplied to OpenTelemetry's auto-configured SDK.
# The default propagators are tracecontext and baggage.
# See https://opentelemetry.io/docs/languages/java/configuration/#environment-variables-and-system-properties for the list of
# available settings.
otel:
  sdk:
    disabled: false
  service:
    name: my-helidon
  exporter:
    otlp:
      endpoint: http://localhost:4318
      protocol: http/protobuf

