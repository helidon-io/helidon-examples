server.host=0.0.0.0
server.port=8080

# Lc4j demo key needs to be routed over lc4j proxy
langchain4j.providers.open-ai.base-url=http://langchain4j.dev/demo/openai/v1
langchain4j.providers.open-ai.api-key=demo
langchain4j.models.chat-model.provider=open-ai
langchain4j.models.chat-model.model-name=gpt-4o-mini

langchain4j.content-retrievers.embedding-store-content-retriever.provider=lc4j-content-retriever
langchain4j.content-retrievers.embedding-store-content-retriever.max-results=10
langchain4j.content-retrievers.embedding-store-content-retriever.min-score=0.6
langchain4j.content-retrievers.embedding-store-content-retriever.embedding-store=EmbeddingStore

app.menu-items=data/menu.json
