server:
  host: "0.0.0.0"
  port: 8080

langchain4j:
  ollama:
    chat-model:
      enabled: true
      model-name: qwen3
      # required, even though its default
      base-url: http://localhost:11434
  coherence:
    embedding-store:
      name: "menu"
      index: "hnsw"
      dimension: 768
  rag:
    embedding-store-content-retriever:
      enabled: true
      max-results: 10
      min-score: 0.6
      # this is how you tell our RAG integration to use coherence embedding store
      embedding-store: "CoherenceEmbeddingStore"
app:
  menu-items: "data/menu.json"