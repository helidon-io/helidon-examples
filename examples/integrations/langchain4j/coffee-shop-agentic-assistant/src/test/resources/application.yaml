declarative:
  ignore-incubating: true

langchain4j:
  providers:
    lc4j-in-process:
      type: all_minilm_l6_v2_q
    lc4j-content-retriever:
      embedding-model: assistant-embedding-model
      max-results: 10
      min-score: 0.0

  models:
    assistant-embedding-model:
      provider: lc4j-in-process

    cheap-model:
      provider: helidon-mock
      rules:
        - pattern: '(?si).*classify it into one of these categories:.*User request: What hot drinks do you have.*'
          response: 'MENU'
        - pattern: '(?si).*classify it into one of these categories:.*User request: Please order one cappuccino.*'
          response: 'ORDER'
        - pattern: '(?si).*classify it into one of these categories:.*User request: Can you explain Kubernetes networking.*'
          response: 'OFF_TOPIC'
        - pattern: '(?si).*If the request is not related to coffee menu or ordering.*User request: Can you explain Kubernetes networking.*'
          response: 'I can only help with coffee menu questions and placing orders.'
        - pattern: '(?si).*You summarize a coffee-shop assistant conversation.*Last User Message:.*Can you explain Kubernetes networking.*'
          response: 'summary: user asked an off-topic question and was redirected to coffee topics.'

    expensive-model:
      provider: helidon-mock
      rules:
        - pattern: '(?si).*User request:.*'
          response: 'deterministic-expensive-response'

  embedding-stores:
    menu-embedding-store:
      provider: lc4j-in-memory

  content-retrievers:
    menu-content-retriever:
      provider: lc4j-content-retriever
      embedding-store: menu-embedding-store

app:
  menu-items: data/menu.json
  forbidden-phrases:
    - instant coffee
    - decaf
