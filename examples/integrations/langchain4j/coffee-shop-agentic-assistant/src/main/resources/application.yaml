server:
  host: "0.0.0.0"
  port: 8080
  features:
    static-content:
      classpath:
        - context: "/"
          location: "/WEB"
          welcome: "index.html"

declarative:
  ignore-incubating: true

langchain4j:
  providers:
    lc4j-in-process:
      type: all_minilm_l6_v2_q

    open-ai:
      # LangChain4j demo key routed over lc4j proxy
      api-key: "demo"
      base-url: "http://langchain4j.dev/demo/openai/v1"
      log-requests: false
      log-responses: false

    lc4j-content-retriever:
      embedding-model: assistant-embedding-model
      max-results: 10
      min-score: 0.6

  models:
    assistant-embedding-model:
      provider: lc4j-in-process

    cheap-model:
      provider: open-ai
      model-name: "gpt-4o-mini"

    expensive-model:
      provider: open-ai
      model-name: "gpt-4o-mini"

  embedding-stores:
    menu-embedding-store:
      provider: lc4j-in-memory

  content-retrievers:
    menu-content-retriever:
      provider: lc4j-content-retriever
      embedding-store: "menu-embedding-store"

app:
  menu-items: "data/menu.json"
